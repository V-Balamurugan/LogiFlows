services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: logiflows-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-logiflows_dev}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-logiflows_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflows-network

  redis:
    image: redis:7-alpine
    container_name: logiflows-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - logiflows-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  logiflows-network:
    driver: bridge
